<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="240" />
    </clipPath>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="#4c5eb3" />
  
  <!-- Sacred Geometry Pattern -->
  <g clip-path="url(#circleClip)" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none">
    <circle cx="256" cy="256" r="180" />
    <circle cx="256" cy="256" r="120" />
    <path d="M 256 20 L 256 492 M 20 256 L 492 256" />
    <path d="M 100 100 L 412 412 M 412 100 L 100 412" />
    <circle cx="256" cy="76" r="10" fill="rgba(255,255,255,0.1)" />
    <circle cx="256" cy="436" r="10" fill="rgba(255,255,255,0.1)" />
    <circle cx="76" cy="256" r="10" fill="rgba(255,255,255,0.1)" />
    <circle cx="436" cy="256" r="10" fill="rgba(255,255,255,0.1)" />
  </g>

  <!-- Spellbook -->
  <g transform="translate(60, 220) rotate(-15)">
    <rect width="140" height="180" rx="8" fill="#8b2f2f" />
    <rect x="10" y="10" width="120" height="160" rx="4" fill="#a53e3e" />
    <path d="M 40 60 L 100 90 L 40 120 Z" fill="none" stroke="#fde047" stroke-width="6" />
    <rect y="160" width="140" height="20" fill="#f5f5f5" rx="2" />
  </g>

  <!-- Potion -->
  <g transform="translate(360, 250) rotate(10)">
    <path d="M 20 40 Q 0 40 0 60 L 0 120 Q 0 140 20 140 L 80 140 Q 100 140 100 120 L 100 60 Q 100 40 80 40 Z" fill="#60a5fa" />
    <path d="M 10 100 Q 50 80 90 100 L 90 120 Q 90 130 80 130 L 20 130 Q 10 130 10 120 Z" fill="#22c55e" />
    <rect x="30" y="10" width="40" height="30" fill="#92400e" rx="4" />
    <path d="M 30 40 L 70 40" stroke="#1e40af" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Wizard Hat -->
  <g transform="translate(256, 280)">
    <!-- Brim -->
    <ellipse cx="0" cy="40" rx="160" ry="50" fill="#4c1d95" />
    <ellipse cx="0" cy="45" rx="140" ry="40" fill="#5b21b6" opacity="0.5" />
    
    <!-- Cone -->
    <path d="M -80 30 L 0 -220 L 80 30 Z" fill="#4c1d95" />
    <path d="M -80 30 L 0 -220 L 0 30 Z" fill="#5b21b6" opacity="0.3" />

    <!-- Gem -->
    <path d="M 0 -150 L 30 -100 L 0 -50 L -30 -100 Z" fill="#ef4444" />
    <path d="M 0 -150 L 30 -100 L 0 -100 Z" fill="#f87171" />

    <!-- Wrappings -->
    <path d="M -70 -20 Q 0 10 70 -20 L 75 10 Q 0 40 -75 10 Z" fill="#e5e7eb" />
    <path d="M -65 -50 Q 0 -20 65 -50 L 70 -20 Q 0 10 -70 -20 Z" fill="#f3f4f6" />

    <!-- Tassels -->
    <path d="M 60 20 Q 80 100 90 180" fill="none" stroke="#fde047" stroke-width="8" stroke-linecap="round" />
    <circle cx="85" cy="120" r="10" fill="#60a5fa" />
    <circle cx="95" cy="180" r="12" fill="#a855f7" />
  </g>

  <!-- Floating Runes & Stars -->
  <g fill="#fde047" opacity="0.8">
    <path d="M 256 30 L 265 55 L 290 55 L 270 75 L 280 100 L 256 85 L 232 100 L 242 75 L 222 55 L 247 55 Z" transform="scale(0.4) translate(400, -80)" />
    <!-- Runic Shape 1 -->
    <path d="M 150 120 L 170 120 L 160 140 Z" />
    <!-- Runic Shape 2 -->
    <path d="M 380 120 L 400 130 L 380 140 Z" />
    <circle cx="320" cy="180" r="4" />
    <circle cx="180" cy="350" r="5" />
    <circle cx="410" cy="380" r="3" />
  </g>
</svg>
